<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeckCraft</title>
  <link data-trunk rel="rust" data-bin="deckcraft-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="icon" href="../../assets/app-icon/hicolor/32x32/apps/ai.storyteller.deckcraft.png" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #deckcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="deckcraft_canvas"></canvas>
  <div id="deckcraft_loading" role="status" aria-live="polite">Loading DeckCraft&hellip;</div>
  <script>
    window.addEventListener("error", function(event) {
      const loading = document.getElementById("deckcraft_loading");
      if (loading && event.message) loading.textContent = "DeckCraft startup error: " + event.message;
    });
    window.addEventListener("unhandledrejection", function(event) {
      const loading = document.getElementById("deckcraft_loading");
      if (loading) loading.textContent = "DeckCraft could not initialize: " + String(event.reason);
    });
    window.setTimeout(function() {
      const loading = document.getElementById("deckcraft_loading");
      if (loading && loading.textContent.includes("Loading DeckCraft")) {
        loading.innerHTML = 'DeckCraft is still starting. <a style="color:#a9ccff" href="./?webgl">Retry with WebGL2</a>. If this repeats, clear this site\'s cached data.';
      }
    }, 25000);
  </script>
</body>
</html>
